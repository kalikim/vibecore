$schema: ./schemas/vibecore.schema.json
apiVersion: vibecore.dev/v1alpha1
kind: Application

metadata:
  name: vibecore
  description: Vibecore CLI and orchestration packages

workspace:
  packageManager: pnpm

applications:
  cli:
    type: api
    framework: node
    path: apps/cli
    commands:
      build: pnpm build
      test: pnpm test

environments:
  dev:
    runtime: local-process
    variableSources:
      default: env-file
  staging:
    runtime: github-actions
    variableSources:
      default: github-environment
  production:
    runtime: github-actions
    production: true
    variableSources:
      default: github-environment

policies:
  requirePlan: true
  requireProductionApproval: true
  requireBackupForDestructiveMigration: true
